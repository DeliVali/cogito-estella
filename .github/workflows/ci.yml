name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install (core + data + mcp extras, CPU torch)
        run: uv sync --extra data --extra mcp
        env:
          UV_TORCH_BACKEND: cpu
      - name: spaCy model for the MCP tests
        run: uv run python -m spacy download en_core_web_sm
      - name: Run test suite
        run: uv run pytest tests/ -q
      - name: Build wheel
        run: uv build
