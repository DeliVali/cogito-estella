[project]
name = "cogito-estella"
version = "0.8.1"
description = "Cogito Estella — Latent Graph Engine: non-autoregressive concept-to-knowledge-graph decoding in the SONAR space"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jeffrey Romero Del Val", email = "delvaljeffrey@gmail.com" }]
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
sonar = [
    "sonar-space>=0.5.0",
    "wtpsplit>=2.1",
]
data = [
    "datasets>=3.0",
    "sacrebleu>=2.4",
    "tqdm>=4.66",
]
graph = [
    "neo4j>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogito_estella"]

[tool.ruff]
line-length = 100
target-version = "py312"
