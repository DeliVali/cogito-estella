[project]
name = "cogito-estella"
version = "0.0.1"
description = "COGITO_ESTELLA — Large Concept Model con resolución adaptativa concepto↔token"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jeffrey Romero Del Val", email = "delvaljeffrey@gmail.com" }]
dependencies = [
    "torch>=2.7",
    "datasets>=3.0",
    "sacrebleu>=2.4",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
sonar = [
    "sonar-space>=0.5.0",
    "wtpsplit>=2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogito_estella"]

[tool.ruff]
line-length = 100
target-version = "py312"
