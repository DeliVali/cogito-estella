[project]
name = "cogito-estella"
version = "0.16.0"
description = "Cogito Estella — Latent Graph Engine: non-autoregressive decoding of sentence embeddings into knowledge graphs"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3.12"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jeffrey Romero Del Val", email = "delvaljeffrey@gmail.com" }]
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "networkx>=3.0",
]

[project.optional-dependencies]
sonar = [
    "sonar-space>=0.5.0",
    "wtpsplit>=2.1",
]
data = [
    "datasets>=3.0",
    "sacrebleu>=2.4",
    "tqdm>=4.66",
]
graph = [
    "neo4j>=5.0",
]
mcp = [
    "mcp>=2.1",
    "spacy>=3.8",
    "tiktoken>=0.7",
    "huggingface-hub>=0.23",
    "sentencepiece>=0.2",
    "transformers>=4.57,<5",
    "safetensors>=0.4",
]
pdf = [
    "pypdf>=4",
]

[project.scripts]
cogito-mcp = "cogito_estella.mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogito_estella"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = ["integration: needs model weights on disk (SONAR/SaT or the decoder ensemble)"]
